name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_FILE: signing/dafter-release.p12
      KS_ALIAS: dafter
      KS_PASS: 2ZJ7IeYgIeEfxRhG5syb
      APK_NAME: dafter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Unzip project (newest zip, if the project was uploaded as a zip)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            z=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
            echo "Using: $z"
            unzip -q -o "$z"
          else
            echo "No zip in the repository: building the files as they are"
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Create Android project
        run: npx cap add android
      - name: Apply customizations
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tools/customize_android.py
      - name: Sync web files and plugins
        run: npx cap sync android
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Align and sign APK
        run: bash tools/sign_apk.sh
      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: dafter-apk
          path: out/dafter.apk
      - name: Publish APK (Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/dafter.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "dafter.apk" \
            --target "${{ github.sha }}"
